name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, so new advisories surface even without commits

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high